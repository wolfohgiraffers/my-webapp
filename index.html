<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Tech Shelf</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --star: #e8a400;
    --news: #d9480f; --news-bg: #fff1e8;
    --blog: #2b8a3e; --blog-bg: #ebfbee;
    --threads: #6741d9; --threads-bg: #f3f0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2e333a;
      --accent: #7aa7ff;
      --accent-soft: #1f2a40;
      --star: #ffc53d;
      --news: #ffa070; --news-bg: #3a2418;
      --blog: #69db7c; --blog-bg: #1b3022;
      --threads: #b197fc; --threads-bg: #2a2340;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-top: 16px;
  }
  .title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
  .week { color: var(--muted); font-size: 14px; }
  .search {
    width: 100%; margin: 12px 0;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    flex: 1;
    padding: 10px 0;
    background: none; border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  main { padding: 16px 0 24px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .week-head { font-size: 15px; font-weight: 700; margin: 22px 0 10px; }
  .week-head:first-child { margin-top: 0; }
  .week-head span { color: var(--muted); font-weight: 500; }

  .card {
    background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meta-left { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .badge.news { color: var(--news); background: var(--news-bg); }
  .badge.blog { color: var(--blog); background: var(--blog-bg); }
  .badge.threads { color: var(--threads); background: var(--threads-bg); }
  .card h2 { font-size: 16px; margin: 0 0 6px; line-height: 1.4; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .why { margin: 0; font-size: 14px; color: var(--muted); }
  .why b { color: var(--text); font-weight: 600; }

  .save {
    flex-shrink: 0;
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .save:hover { border-color: var(--star); }
  .save.on { background: var(--accent-soft); border-color: transparent; color: var(--star); font-weight: 700; }
  .save.remove:hover { border-color: #e03131; color: #e03131; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .notice {
    background: var(--news-bg); color: var(--news);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px;
  }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 8px 0 32px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="title-row">
      <h1>Weekly Tech Shelf</h1>
      <div class="week" id="weekLabel"></div>
    </div>
    <input class="search" id="search" type="search" placeholder="🔍 제목·한 줄 이유로 검색" aria-label="검색">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-recs" aria-selected="true">이번 주 추천</button>
      <button class="tab" role="tab" id="tab-saved" aria-selected="false">보관함</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap" id="footer"></footer>

<script>
/* ===================================================================
   이번 주 추천 데이터
   매주 Claude가 이 부분만 새로 바꿉니다.
   source: "news" | "blog" | "threads"
   =================================================================== */
const RECS = {
  updated: "2026-11-25",
  weekStart: "2026-11-23",   // 이번 주 월요일
  items: [
    {
      id: "2026-11-23-openai-gpt62",
      source: "news", date: "2026-11-17",
      title: "OpenAI, GPT-6.2 Astra·Sol 발표 (공식 발표문)",
      url: "https://openai.com/index/introducing-gpt-6-2-astra-sol",
      why: "이번 주 가장 큰 모델 출시예요. 어려운 작업용(Astra)과 일상용(Sol)이 나뉘니, 어떤 일에 어느 쪽을 쓸지 가격표와 함께 정해 두기 좋아요."
    },
    {
      id: "2026-11-23-aa-compare",
      source: "news", date: null,
      title: "Gemini 4 Neon vs GPT-6.2 Astra 비교 (Artificial Analysis)",
      url: "https://artificialanalysis.ai/ko/models/comparisons/gemini-4-neon-vs-gpt-6-2-astra",
      why: "보도마다 엇갈리는 새 모델들의 성능·가격·속도를 한 표로 비교할 수 있어요. 한국어 페이지라 빠르게 훑기 좋아요."
    },
    {
      id: "2026-11-23-neuron-1125",
      source: "news", date: "2026-11-25",
      title: "Everything That Happened in AI Today (11월 25일, The Neuron)",
      url: "https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-november-25-2026/",
      why: "오늘 하루 AI 소식을 한 페이지에 모아 둔 다이제스트예요. 여러 곳을 돌아다니지 않고 오늘 흐름을 5분 안에 잡을 수 있어요."
    },
    {
      id: "2026-11-23-writingmate-week",
      source: "news", date: "2026-11-23",
      title: "AI News, Week of November 23 (Writingmate)",
      url: "https://writingmate.ai/blog/ai-news-week-of-2026-11-23",
      why: "이번 주 모델 출시와 업계 이슈를 주간 단위로 정리했어요. 다만 세부 수치는 출처마다 달라서 중요한 건 원문으로 확인하세요."
    },
    {
      id: "2026-11-23-velopers",
      source: "blog", date: "2026-11-22",
      title: "Velopers: 국내 IT 기업 기술 블로그 모음",
      url: "https://velopers.kr/",
      why: "AWS의 AgentCore CLI 에이전트 개발·배포 글, 토스의 AI 3D 그래픽 제작기 등 국내 실무 사례가 이번 주에 올라왔어요."
    },
    {
      id: "2026-11-23-technews-66",
      source: "blog", date: "2026-11-23",
      title: "2026-11-23 LLM/AI 기술 추천 (techNews #66)",
      url: "https://github.com/8silvergun/techNews/issues/66",
      why: "작은 모델로 수학 증명을 탐색하는 연구, AI 추론을 빠르게 하는 컴파일러 연구 등 깊이 있는 글을 골라 놓은 목록이에요."
    },
    {
      id: "2026-11-23-techblogs-11",
      source: "blog", date: "2026-11-25",
      title: "새 AI 글 2026-11-25 · 32개 (해외 기술 블로그 모음)",
      url: "https://github.com/mzd-minahKim/tech-blogs/issues/11",
      why: "OpenAI·Hugging Face·NVIDIA 블로그 새 글 제목을 한 번에 볼 수 있어요. NVIDIA Cosmos 3를 내 PC에서 돌리는 가이드도 있어요."
    },
    {
      id: "2026-11-23-jiufeng-releases",
      source: "blog", date: null,
      title: "New AI Models — November 2026 (출시 목록)",
      url: "https://blog.jiufeng.ai/releases/2026-11",
      why: "11월에 나온 모델을 날짜순으로 정리한 목록이에요. Google Genie 4, LG K-EXAONE-2.5 API처럼 놓치기 쉬운 출시도 챙길 수 있어요."
    },
    {
      id: "2026-11-23-axnotes-threads",
      source: "threads", date: "2026-11-04",
      title: "[AI 다이제스트] Threads AI 소식 모음 (ax-notes)",
      url: "https://github.com/msaltnet/ax-notes-public/issues/120",
      why: "Threads 큐레이터들이 올린 AI 소식을 모아 둔 다이제스트예요. 여러 AI 에이전트가 폰을 조작하게 하는 MCP 같은 실험적인 도구를 알 수 있어요."
    },
    {
      id: "2026-11-23-boris-workflow",
      source: "threads", date: null,
      title: "Claude Code 창시자 Boris Cherny의 워크플로우 완전 해부",
      url: "https://wikidocs.net/blog/@jaehong/8587/",
      why: "Threads에서 화제가 된 시리즈를 한국어로 정리한 글이에요. 계획 먼저 세우기, 세션 여러 개 동시에 돌리기 같은 팁을 바로 따라 해 볼 수 있어요."
    }
  ]
};

/* ===================================================================
   아래는 앱 동작 코드
   =================================================================== */
const SOURCE_LABEL = { news: "뉴스", blog: "블로그", threads: "Threads" };
const STORE_KEY = "weeklyTechShelf.saved";

let storageOk = true;
let saved = {};            // id -> { ...item, weekStart, savedAt }
let tab = "recs";
let filter = "all";
let query = "";

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    saved = raw ? JSON.parse(raw) : {};
  } catch (e) {
    storageOk = false;
    saved = {};
  }
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); }
  catch (e) { storageOk = false; }
}

function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - diff);
  return d;
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function weekName(weekStart) {
  const mon = parseDate(weekStart);
  return (mon.getMonth() + 1) + "월 " + Math.ceil(mon.getDate() / 7) + "주차";
}
function weekRange(weekStart) {
  const mon = parseDate(weekStart);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return (mon.getMonth() + 1) + "/" + mon.getDate() + "–" + (sun.getMonth() + 1) + "/" + sun.getDate();
}
function shortDate(s) { const d = parseDate(s); return (d.getMonth() + 1) + "/" + d.getDate(); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function matches(item) {
  if (!query) return true;
  const q = query.toLowerCase();
  return item.title.toLowerCase().includes(q) || item.why.toLowerCase().includes(q);
}

function cardHTML(item, mode) {
  const isSaved = !!saved[item.id];
  let btn;
  if (mode === "saved") {
    btn = `<button class="save remove" data-id="${esc(item.id)}">저장 해제</button>`;
  } else {
    btn = isSaved
      ? `<button class="save on" data-id="${esc(item.id)}" aria-pressed="true">★ 저장됨</button>`
      : `<button class="save" data-id="${esc(item.id)}" aria-pressed="false">☆ 저장</button>`;
  }
  return `
    <article class="card">
      <div class="meta">
        <div class="meta-left">
          <span class="badge ${esc(item.source)}">${SOURCE_LABEL[item.source] || esc(item.source)}</span>
          ${item.date ? `<span>${shortDate(item.date)}</span>` : ""}
        </div>
        ${btn}
      </div>
      <h2><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h2>
      <p class="why"><b>💡 AI 한 줄</b> ${esc(item.why)}</p>
    </article>`;
}

function emptyHTML(text) { return `<div class="empty">${text}</div>`; }

function render() {
  const main = document.getElementById("main");
  const savedList = Object.values(saved);

  document.getElementById("tab-recs").textContent = `이번 주 추천 (${RECS.items.length})`;
  document.getElementById("tab-saved").textContent = `보관함 (${savedList.length})`;
  document.getElementById("tab-recs").setAttribute("aria-selected", tab === "recs");
  document.getElementById("tab-saved").setAttribute("aria-selected", tab === "saved");

  let html = "";
  if (!storageOk) {
    html += `<div class="notice">이 브라우저에서는 저장 기능을 쓸 수 없어요. 저장한 글은 창을 닫으면 사라집니다.</div>`;
  }

  if (tab === "recs") {
    const chips = [["all", "전체"], ["blog", "블로그"], ["news", "뉴스"], ["threads", "Threads"]];
    html += `<div class="chips">` + chips.map(([k, label]) =>
      `<button class="chip" data-filter="${k}" aria-pressed="${filter === k}">${label}</button>`).join("") + `</div>`;

    const list = RECS.items.filter(it => (filter === "all" || it.source === filter) && matches(it));
    if (list.length === 0) {
      html += query ? emptyHTML(`'${esc(query)}'에 맞는 글이 없어요`) : emptyHTML("이 출처의 추천 글이 이번 주에는 없어요");
    } else {
      html += list.map(it => cardHTML(it, "recs")).join("");
    }
  } else {
    if (savedList.length === 0) {
      html += emptyHTML("아직 저장한 글이 없어요.<br>추천 탭에서 ☆를 눌러 보세요");
    } else {
      const list = savedList.filter(matches);
      if (list.length === 0) {
        html += emptyHTML(`'${esc(query)}'에 맞는 글이 없어요`);
      } else {
        const groups = {};
        list.forEach(it => { (groups[it.weekStart] = groups[it.weekStart] || []).push(it); });
        Object.keys(groups).sort().reverse().forEach(w => {
          const items = groups[w].sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""));
          html += `<div class="week-head">${weekName(w)} <span>· ${items.length}개 (${weekRange(w)})</span></div>`;
          html += items.map(it => cardHTML(it, "saved")).join("");
        });
      }
    }
  }
  main.innerHTML = html;
}

function toggleSave(id) {
  if (saved[id]) {
    delete saved[id];
  } else {
    const item = RECS.items.find(it => it.id === id);
    if (!item) return;
    saved[id] = { ...item, weekStart: RECS.weekStart, savedAt: new Date().toISOString() };
  }
  persist();
  render();
}

function init() {
  loadSaved();
  document.getElementById("weekLabel").textContent = `${weekName(RECS.weekStart)} (${weekRange(RECS.weekStart)})`;
  document.getElementById("footer").textContent = `추천 업데이트: ${RECS.updated}`;

  document.getElementById("tab-recs").addEventListener("click", () => { tab = "recs"; render(); });
  document.getElementById("tab-saved").addEventListener("click", () => { tab = "saved"; render(); });
  document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });

  document.getElementById("main").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) { filter = chip.dataset.filter; render(); return; }
    const btn = e.target.closest(".save");
    if (btn) toggleSave(btn.dataset.id);
  });

  render();
}
init();
</script>
</body>
</html>
